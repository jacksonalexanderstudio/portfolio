<script>
(function(){
  const SVGNS = 'http://www.w3.org/2000/svg';
  const root  = document.documentElement;
  const svg   = document.getElementById('logo');
  const EASE  = 'cubic-bezier(.3,.15,.25,1)';
  const PAD   = 50;       // dash-gap padding for the hidden state
  const UN_WIDTH = 18;    // wider reveal for the "un"

  const KEYS  = ['un','o','r','ur','s1','d','i','n','g','s2','idot'];
  const LEFT  = ['o','r','ur','s1'];
  const RIGHT = ['d','i','n','g','s2'];
  const L = {};

  function reversePath(el){
    const total = el.getTotalLength(), STEP = 0.1, pts = [];
    for(let d = 0; d <= total; d += STEP) pts.push(el.getPointAtLength(d));
    pts.push(el.getPointAtLength(total));
    pts.reverse();
    el.setAttribute('d', 'M' + pts.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join('L'));
  }
  function splitUn(src){
    const total = src.getTotalLength(), STEP = 0.5, pts = [];
    for(let d = 0; d <= total; d += STEP) pts.push(src.getPointAtLength(d));
    pts.push(src.getPointAtLength(total));
    const seam = (pts.length / 2) | 0;
    const toD = arr => 'M' + arr.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join('L');
    return [ toD(pts.slice(0, seam + 1).reverse()), toD(pts.slice(seam)) ];
  }

  const defs = svg.querySelector('defs');
  KEYS.forEach(key => {
    const fill = document.getElementById('f-' + key);
    const mask = document.createElementNS(SVGNS,'mask');
    mask.id = 'mask-' + key;
    mask.setAttribute('maskUnits','userSpaceOnUse');
    mask.setAttribute('x','0'); mask.setAttribute('y','0');
    mask.setAttribute('width','263.72'); mask.setAttribute('height','60.71');
    let strokeEls;
    if(key === 'un'){
      const src = document.getElementById('c-un');
      strokeEls = splitUn(src).map(d => { const p = document.createElementNS(SVGNS,'path'); p.setAttribute('d', d); return p; });
      src.remove();
    } else {
      const src = document.getElementById('c-' + key);
      if(key === 's2') reversePath(src);
      strokeEls = [src];
    }
    const strokes = strokeEls.map(el => {
      el.classList.add('mstroke');
      if(key === 'un') el.style.strokeWidth = UN_WIDTH + 'px';
      mask.appendChild(el);
      const len = el.getTotalLength();
      el.style.strokeDasharray  = len + ' ' + (len + 2*PAD);
      el.style.strokeDashoffset = len + PAD;
      return { el, len };
    });
    defs.appendChild(mask);
    fill.setAttribute('mask','url(#mask-' + key + ')');
    L[key] = { fill, strokes };
  });

  function vars(){
    const cs = getComputedStyle(root), v = n => parseFloat(cs.getPropertyValue(n));
    return { lead:v('--lead'), unDur:v('--un-dur'), hold:v('--hold'),
             letterDur:v('--letter-dur'), stagger:v('--stagger'), tail:v('--tail'), fade:v('--fade') };
  }

  // ===== FORWARD — original draw(), verbatim =====
  function draw(key, delay, dur){
    const e = L[key];
    const easing = (key === 'un') ? 'linear' : EASE;
    const anims = e.strokes.map(s => s.el.animate(
      [{ strokeDashoffset:s.len + PAD, offset:0 },
       { strokeDashoffset:s.len,       offset:0.0001 },
       { strokeDashoffset:0,           offset:1 }],
      { duration:dur*1000, delay:delay*1000, easing, fill:'both' }
    ));
    const fade = parseFloat(getComputedStyle(root).getPropertyValue('--fade'));
    if(fade > 0){
      e.fill.animate([{ opacity:0 }, { opacity:1 }], { duration:dur*fade*1000, delay:delay*1000, easing, fill:'both' });
    }
    anims[anims.length - 1].onfinish = () => {
      if(key === 'un'){ e.fill.removeAttribute('mask'); return; }
      let pending = e.strokes.length;
      e.strokes.forEach(s => {
        const fat = s.el.animate([{ strokeWidth:getComputedStyle(s.el).strokeWidth }, { strokeWidth:'80px' }], { duration:220, easing:'ease-out', fill:'both' });
        fat.onfinish = () => { if(--pending === 0) e.fill.removeAttribute('mask'); };
      });
    };
  }
  function play(){
    KEYS.forEach(key => {
      const e = L[key];
      e.strokes.forEach(s => { s.el.getAnimations().forEach(a => a.cancel()); s.el.style.strokeDashoffset = s.len + PAD; });
      e.fill.getAnimations().forEach(a => a.cancel());
      e.fill.style.opacity = '';
      e.fill.setAttribute('mask', 'url(#mask-' + key + ')');
    });
    const t = vars();
    draw('un', t.lead, t.unDur);
    const restStart = t.lead + t.unDur + t.hold;
    const span   = Math.max(LEFT.length, RIGHT.length) - 1;
    const window = span * t.stagger;
    [LEFT, RIGHT].forEach(side => {
      const step = side.length > 1 ? window / (side.length - 1) : 0;
      side.forEach((k,i) => draw(k, restStart + i*step, t.letterDur));
    });
    const cascadeEnd = restStart + window + t.letterDur;
    draw('idot', cascadeEnd + 0.30, 0.35);
  }

  // ===== timing table (same formulas as play) =====
  const FATTEN_MS = 220, FATTEN_W = 80;
  const REV_EASE  = 'cubic-bezier(.75,0,.70,.85)';   // time-reflection of EASE
  const FULL_HOLD = 3.0;    // dwell on the finished wordmark (per spec)
  const EMPTY_HOLD = 0.0;   // dwell on the empty state before rebuilding
  function schedule(){
    const t = vars();
    const cov = parseFloat(getComputedStyle(root).getPropertyValue('--coverage'));
    const restStart = t.lead + t.unDur + t.hold;
    const span = Math.max(LEFT.length, RIGHT.length) - 1;
    const win  = span * t.stagger;
    const rows = [{ key:'un', start:t.lead, dur:t.unDur, fatten:false, baseW:UN_WIDTH }];
    [LEFT, RIGHT].forEach(side => {
      const step = side.length > 1 ? win/(side.length-1) : 0;
      side.forEach((k,i) => rows.push({ key:k, start:restStart + i*step, dur:t.letterDur, fatten:true, baseW:cov }));
    });
    const cascadeEnd = restStart + win + t.letterDur;
    rows.push({ key:'idot', start:cascadeEnd + 0.30, dur:0.35, fatten:true, baseW:cov });
    let T = 0;
    rows.forEach(r => {
      r.drawEnd   = r.start + r.dur;
      r.settleEnd = r.drawEnd + (r.fatten ? FATTEN_MS/1000 : 0);
      r.fadeDur   = (t.fade > 0) ? r.dur*t.fade : 0;
      r.fadeEnd   = r.start + r.fadeDur;
      T = Math.max(T, r.settleEnd, r.fadeEnd);
    });
    return { rows, T };
  }

  // ===== REVERSE — exact temporal mirror of the forward pass =====
  function reversePlay(){
    const { rows, T } = schedule();
    // seed the fully-revealed end-state, then re-apply masks so we can un-draw
    rows.forEach(r => {
      const e = L[r.key];
      e.fill.getAnimations().forEach(a => a.cancel());
      e.fill.setAttribute('mask', 'url(#mask-' + r.key + ')');
      e.fill.style.opacity = '1';
      e.strokes.forEach(s => {
        s.el.getAnimations().forEach(a => a.cancel());
        s.el.style.strokeDashoffset = 0;
        s.el.style.strokeWidth = (r.fatten ? FATTEN_W : r.baseW) + 'px';
      });
    });
    rows.forEach(r => {
      const e = L[r.key];
      const easing = (r.key === 'un') ? 'linear' : REV_EASE;
      // mirror of the end-of-draw fatten: un-fatten 80 -> base
      if(r.fatten){
        const revFat = T - r.settleEnd;
        e.strokes.forEach(s => s.el.animate(
          [{ strokeWidth:FATTEN_W + 'px' }, { strokeWidth:r.baseW + 'px' }],
          { duration:FATTEN_MS, delay:revFat*1000, easing:'ease-in', fill:'both' }
        ));
      }
      // mirror of the draw: un-draw 0 -> hidden
      const revDraw = T - r.drawEnd;
      e.strokes.forEach(s => s.el.animate(
        [{ strokeDashoffset:0,           offset:0 },
         { strokeDashoffset:s.len,       offset:0.9999 },
         { strokeDashoffset:s.len + PAD, offset:1 }],
        { duration:r.dur*1000, delay:revDraw*1000, easing, fill:'both' }
      ));
      // mirror of the fill fade: opacity 1 -> 0
      if(r.fadeDur > 0){
        const revFade = T - r.fadeEnd;
        e.fill.animate([{ opacity:1 }, { opacity:0 }], { duration:r.fadeDur*1000, delay:revFade*1000, easing, fill:'both' });
      }
    });
    return T;
  }

  function resetHidden(){
    KEYS.forEach(key => {
      const e = L[key];
      e.strokes.forEach(s => {
        s.el.style.strokeDashoffset = s.len + PAD;   // hidden first...
        s.el.getAnimations().forEach(a => a.cancel()); // ...then drop held values
        s.el.style.strokeWidth = (key === 'un') ? UN_WIDTH + 'px' : '';
      });
      e.fill.getAnimations().forEach(a => a.cancel());
      e.fill.style.opacity = '';
      e.fill.setAttribute('mask', 'url(#mask-' + key + ')');
    });
  }

  let tid = null;
  function forwardPhase(){
    const { T } = schedule();
    resetHidden();
    play();
    tid = setTimeout(reversePhase, (T + FULL_HOLD) * 1000);
  }
  function reversePhase(){
    const T = reversePlay();
    tid = setTimeout(forwardPhase, (T + EMPTY_HOLD) * 1000);
  }

  svg.style.visibility = 'visible';
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    KEYS.forEach(k => L[k].fill.removeAttribute('mask'));   // static end-state
  } else {
    forwardPhase();
  }
})();
</script>
