<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#050507;
  --moon:rgba(236,240,252,.88);
  --moon-dim:rgba(236,240,252,.55);
  --moon-faint:rgba(236,240,252,.30);
  --disp:'Unbounded',sans-serif;
  --mono:'Red Hat Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--moon);font-family:var(--mono);line-height:1.6;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.5) 100%)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

main,.zone,#topbar,#ftr2{position:relative;z-index:1}

/* ── TOPBAR ── */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:30px 46px 10px}
.lm2{display:flex;align-items:baseline;gap:4px;font:300 19px/1 var(--disp);letter-spacing:.05em;color:var(--moon)}
.lm2 .lm2-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin:0 1px;
  animation:dot-hue 26s linear infinite}
.lm2 .lm2-ja{font-size:11px;color:var(--moon-dim);letter-spacing:.14em}
@keyframes dot-hue{
  0%  {background:#ffb966;box-shadow:0 0 10px #ffb966,0 0 26px rgba(255,185,102,.55)}
  17% {background:#ffe08a;box-shadow:0 0 10px #ffe08a,0 0 26px rgba(255,224,138,.55)}
  33% {background:#8ef2a9;box-shadow:0 0 10px #8ef2a9,0 0 26px rgba(142,242,169,.5)}
  50% {background:#7db5ff;box-shadow:0 0 10px #7db5ff,0 0 26px rgba(125,181,255,.55)}
  67% {background:#ab8bff;box-shadow:0 0 10px #ab8bff,0 0 26px rgba(171,139,255,.55)}
  83% {background:#ff8ad2;box-shadow:0 0 10px #ff8ad2,0 0 26px rgba(255,138,210,.55)}
  100%{background:#ffb966;box-shadow:0 0 10px #ffb966,0 0 26px rgba(255,185,102,.55)}
}
.link-line{display:flex;align-items:center;gap:10px;font:400 9px/1 var(--mono);
  letter-spacing:.22em;text-transform:uppercase;color:var(--moon-faint)}
.link-dot{width:7px;height:7px;border-radius:50%;background:rgba(236,240,252,.18);flex-shrink:0;transition:all .6s}
.link-line.live .link-dot{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9),0 0 28px rgba(255,255,255,.4);animation:dotpulse 3s ease-in-out infinite}
.link-line.live{color:var(--moon-dim)}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.45}}
.back-link{font:400 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--moon-faint);transition:color .3s,text-shadow .3s}
.back-link:hover{color:var(--moon);text-shadow:0 0 14px rgba(255,255,255,.5)}

/* ── ZONES (sections are pools of attention, not boxes) ── */
.zone{padding:64px 46px 56px}
.console-section-title{font:200 12px/1 var(--disp);letter-spacing:.42em;text-transform:uppercase;
  color:var(--moon-dim);margin:0 0 34px;border:none;padding:0;
  text-shadow:0 0 22px rgba(236,240,252,.25)}
.console-section-title:not(:first-child){margin-top:70px}
.console-section-count{float:right;font:300 10px/1 var(--mono);color:var(--moon-faint);letter-spacing:.1em}

/* luminous control primitives */
.desk-btn,.fixture-power,#nowbar .stop{
  font:400 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--moon-dim);background:rgba(236,240,252,.05);border-radius:10px;
  padding:10px 16px;transition:all .35s ease}
.desk-btn:hover,.fixture-power:hover,#nowbar .stop:hover{
  color:#fff;background:rgba(236,240,252,.1);
  box-shadow:0 0 18px rgba(236,240,252,.22),0 0 46px rgba(236,240,252,.08)}
.desk-btn.armed{color:#fff;background:rgba(236,240,252,.14);
  box-shadow:0 0 22px rgba(236,240,252,.4);animation:dotpulse 1.3s ease-in-out infinite}
.fixture-power.on{color:#fff;background:rgba(236,240,252,.12);
  box-shadow:0 0 16px rgba(236,240,252,.25)}

input[type="range"]{-webkit-appearance:none;appearance:none;height:2px;outline:none;
  background:linear-gradient(90deg,rgba(236,240,252,.05),rgba(236,240,252,.3),rgba(236,240,252,.05))}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:13px;height:13px;border-radius:50%;background:#fff;border:none;cursor:pointer;
  box-shadow:0 0 10px rgba(255,255,255,.9),0 0 26px rgba(255,255,255,.35)}
input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:none;cursor:pointer;
  box-shadow:0 0 10px rgba(255,255,255,.9),0 0 26px rgba(255,255,255,.35)}

/* ── THE ROOM ── */
.room-section{padding:30px 46px 54px}
.room-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:30px}
.room-rack{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.fixture{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 10px 6px;
  border-radius:18px;transition:opacity .4s;
  background:radial-gradient(70% 55% at 50% 0%,rgba(236,240,252,.035),transparent 72%)}
.room-rack.locked .fixture{opacity:.32;pointer-events:none}
.fixture-stage{height:88px;display:flex;align-items:flex-end;justify-content:center}
.fixture-glyph{border-radius:5px;transition:background .5s,box-shadow .5s}
.fixture-glyph.bar{width:10px;height:78px}
.fixture-glyph.wash{width:64px;height:24px;border-radius:12px 12px 5px 5px}
.fixture-name{font:300 9px/1 var(--disp);letter-spacing:.3em;text-transform:uppercase;color:var(--moon-dim)}
.fixture-bri{width:100%}
.fixture.unreachable .fixture-name::after{content:' · dark';color:#ffb966;letter-spacing:.1em}

/* ── DIAL ── */
.wheel-section{padding:56px 46px 52px}
.wheel-row{display:flex;gap:52px;align-items:center;flex-wrap:wrap}
.wheel-canvas-wrap{width:min(290px,76vw);aspect-ratio:1;flex-shrink:0;border-radius:50%;
  box-shadow:0 0 60px rgba(236,240,252,.06),0 30px 80px rgba(0,0,0,.55)}
#wheel{width:100%;height:100%;display:block;cursor:crosshair;border-radius:50%;touch-action:none}
.wheel-side{flex:1;min-width:250px;max-width:430px;display:flex;flex-direction:column;gap:20px}
.wheel-preview-wrap{aspect-ratio:16/10;background:#000;overflow:hidden;border-radius:16px;
  box-shadow:0 16px 60px rgba(0,0,0,.6),0 0 40px rgba(236,240,252,.05)}
#wheelPreview{width:100%;height:100%;display:block}
.wheel-bri{display:flex;align-items:center;gap:16px}
.wheel-bri-label{font:400 9px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--moon-dim);flex-shrink:0}
#wheelBri{flex:1}
.wheel-hint{font:300 10px/1.8 var(--mono);letter-spacing:.04em;color:var(--moon-faint)}

/* ── DESK ── */
.mini-wheel{position:relative;width:54px;height:54px;border-radius:50%;cursor:crosshair;touch-action:none;
  box-shadow:0 0 16px rgba(236,240,252,.08)}
.mini-wheel canvas{width:100%;height:100%;display:block;border-radius:50%}
.mini-wheel .mw-dot{position:absolute;width:10px;height:10px;border-radius:50%;border:none;
  box-shadow:0 0 6px rgba(255,255,255,.95),0 0 16px rgba(255,255,255,.45),inset 0 0 2px rgba(0,0,0,.4);
  transform:translate(-50%,-50%);pointer-events:none}

/* ── LIBRARY ── */
#grid{padding:56px 46px 150px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.preset{display:flex;align-items:center;gap:13px;padding:14px 17px;border-radius:12px;
  background:rgba(236,240,252,.045);transition:all .3s ease;cursor:pointer;text-align:left}
.preset:hover{background:rgba(236,240,252,.09);box-shadow:0 0 18px rgba(236,240,252,.1)}
.preset.playing{background:rgba(236,240,252,.11);box-shadow:0 0 24px rgba(236,240,252,.2)}
.preset.playing .preset-dot{animation:dotpulse 1.6s ease-in-out infinite}
.preset-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;transition:box-shadow .3s}
.preset-title{font:300 10px/1.4 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--moon)}
.console-empty{grid-column:1/-1;padding:100px 20px;text-align:center;font:300 12px/1.8 var(--mono);color:var(--moon-faint)}

/* ── NOW PLAYING ── */
#nowbar{position:fixed;left:50%;bottom:28px;transform:translate(-50%,160%);z-index:10;display:flex;align-items:center;gap:22px;
  background:rgba(8,8,11,.72);backdrop-filter:blur(16px);border-radius:16px;padding:14px 16px 14px 24px;
  box-shadow:0 20px 70px rgba(0,0,0,.65),0 0 30px rgba(236,240,252,.07);
  transition:transform .6s cubic-bezier(.22,1,.36,1)}
#nowbar.show{transform:translate(-50%,0)}
.nowbar-label{font:400 8px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--moon-faint)}
.nowbar-title{font:300 11px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 16px rgba(255,255,255,.35)}

/* ── FOOT ── */
#ftr2{padding:60px 46px 44px;text-align:center;font:300 9px/1.8 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--moon-faint)}
#ftr2 a:hover{color:var(--moon);text-shadow:0 0 12px rgba(255,255,255,.4)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  #topbar{padding:22px 18px 6px}
  .zone,.room-section,.wheel-section,.desk-section{padding-left:18px;padding-right:18px}
  #grid{padding:44px 14px 130px}
  .room-rack{grid-template-columns:repeat(2,1fr)}
  .pad-rack{grid-template-columns:repeat(4,1fr)}
  #nowbar{left:16px;right:16px;transform:translateY(160%);width:auto}
  #nowbar.show{transform:translateY(0)}
}
@media(max-width:600px){.preset-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  .link-line.live .link-dot,.lm2-dot{animation:none}
}
</style>
</head>

      sim:{ kind:'static', rgb:[[245,240,225],[245,240,225]], bri:0.9 } },
    { id:'gallery-white', num:'W-03', title:'Gallery White', tagline:'Steady warm white (~2700K) — the all-purpose room light.', mood:['work','neutral','warm'], section:'work', type:'scene',

  // Hue API hue (0-65535) + sat + bri → rgb. HSV is a fair approximation
  // of the lamp output for simulation purposes.
  function hueToRgb(apiHue, sat, bri) {
    var h = (apiHue % 65536) / 65536 * 360, s = sat / 254, v = bri / 254;
    var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
    var r = 0, g = 0, b = 0;
    if (h < 60)       { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else              { r = c; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];

  function easeCos(f) { return (1 - Math.cos(Math.PI * f)) / 2; }

    var diff = ((to - from + 32768) % 65536) - 32768;
    return (from + diff * f + 65536) % 65536;

  };

  function presetColor(p) {
    if (p.sim && p.sim.kind === 'static' && p.sim.rgb) return p.sim.rgb[0];
    return PRESET_COLORS[p.id] || [205, 210, 228];
  }

  function buildCard(p) {
    var el = document.createElement('button');
    el.className = 'preset';
    el.setAttribute('data-id', p.id);
    el.title = p.tagline || p.title;
    var c = presetColor(p);
    var rgb = (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0);
    el.innerHTML =
      '<span class="preset-dot" style="background:rgb(' + rgb + ');' +
      'box-shadow:0 0 9px rgba(' + rgb + ',.9),0 0 22px rgba(' + rgb + ',.35)"></span>' +
      '<span class="preset-title">' + p.title + '</span>';
    el.addEventListener('click', function() { cast(p); });
    return el;
  }

  function render(list) {
    grid.innerHTML = '';
    if (!list.length) {
      grid.innerHTML = '<div class="console-empty">Nothing matches &mdash; the room stays dark.</div>';
    }
    SECTIONS.forEach(function(sec) {
      var inSec = list.filter(function(p) { return (p.section || 'shows') === sec.key; });
      if (!inSec.length) return;
      var h = document.createElement('h2');
      h.className = 'console-section-title';
      h.innerHTML = sec.label + '<span class="console-section-count">' + inSec.length + '</span>';
      grid.appendChild(h);
      var g = document.createElement('div');
      g.className = 'preset-grid';
      inSec.forEach(function(p) { g.appendChild(buildCard(p)); });
      grid.appendChild(g);
    });
    markPlaying();
  }

  // ── ANIMATION LOOP (one rAF for all cards) ──
  var t0 = performance.now();
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    var t = (now - t0) / 1000;
    if (typeof drawWheel === 'function' && wheelBase) {
      drawWheel();
      drawRoom(wheelPrevCtx, wheelPrev.width, wheelPrev.height, wheelLampStates());
    }
    if (!reduceMotion) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // the sections organize the library; no search layer needed
  function apply() {
    render(PRESETS);
  }

  // ── COLOR WHEEL ──
  // HSV disc: hue by angle, saturation by radius. Two handles — R and L,
  // one per lamp. Dragging previews always; when the studio link is live it
  // also casts, throttled to spare the bridge.
  var wheelCanvas = document.getElementById('wheel');
  var wheelCtx = wheelCanvas.getContext('2d');
  var wheelPrev = document.getElementById('wheelPreview');
  var wheelPrevCtx = wheelPrev.getContext('2d');
  var wheelBri = document.getElementById('wheelBri');
  var wheelBase = null;   // cached disc pixels
  var wheelSize = 0;
  var handles = {
    R: { hue: 49500, sat: 240 },
    L: { hue: 51500, sat: 210 }
  };
  var dragging = null;

  function sizeWheel() {
    var r = wheelCanvas.parentNode.getBoundingClientRect();
    if (r.width < 4) return;
    var s = Math.round(r.width * (window.devicePixelRatio || 1));
    if (s === wheelSize) return;
    wheelSize = s;
    wheelCanvas.width = wheelCanvas.height = s;
    // lit glass orb: the HSV disc rendered as a sphere — surface normals,
    // a key light up-left, specular hot-spot, limb-darkened edge. Same
    // mapping (angle=hue, radius=sat); entirely different object.
    var img = wheelCtx.createImageData(s, s);
    var c = s / 2, rad = s / 2;
    var Lx = -0.42, Ly = -0.55, Lz = 0.72;      // key light direction
    for (var y = 0; y < s; y++) {
      for (var x = 0; x < s; x++) {
        var dx = x - c, dy = y - c;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var idx = (y * s + x) * 4;
        if (dist > rad) { img.data[idx + 3] = 0; continue; }
        var ang = Math.atan2(dy, dx);           // -π..π
        var hue = ((ang / (2 * Math.PI)) + 0.5) * 65535;
        var sat = Math.min(1, dist / rad) * 254;
        var rgb = hueToRgb(hue, sat, 254);
        // sphere normal at this pixel
        var nx = dx / rad, ny = dy / rad;
        var nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
        var diff = Math.max(0, nx * Lx + ny * Ly + nz * Lz);
        var lum = 0.34 + 0.72 * diff;           // ambient + key
        var spec = Math.pow(diff, 26) * 0.85;   // glassy hot-spot
        var limb = 0.55 + 0.45 * nz;            // darkened silhouette edge
        img.data[idx]     = Math.min(255, rgb[0] * lum * limb + 255 * spec);
        img.data[idx + 1] = Math.min(255, rgb[1] * lum * limb + 255 * spec);
        img.data[idx + 2] = Math.min(255, rgb[2] * lum * limb + 255 * spec);
        img.data[idx + 3] = dist > rad - 2 ? Math.max(0, 255 * (rad - dist) / 2) : 255;
      }
    }
    wheelCtx.putImageData(img, 0, 0);
    wheelBase = wheelCtx.getImageData(0, 0, s, s);
    var pr = wheelPrev.parentNode.getBoundingClientRect();
    wheelPrev.width = pr.width * (window.devicePixelRatio || 1) / 2;
    wheelPrev.height = pr.height * (window.devicePixelRatio || 1) / 2;
  }

  function handlePos(h) {
    var c = wheelSize / 2;
    var ang = (h.hue / 65535 - 0.5) * 2 * Math.PI;
    var dist = (h.sat / 254) * c;
    return [c + Math.cos(ang) * dist, c + Math.sin(ang) * dist];
  }

  function drawWheel() {
    if (!wheelBase) return;
    wheelCtx.putImageData(wheelBase, 0, 0);
    var s = wheelSize, c = s / 2;
    var t = performance.now() / 1000;

    // breathing sheen orbiting the orb — alive, never loud
    var oa = t * 0.35;
    var ox = c + Math.cos(oa) * c * 0.42, oy = c + Math.sin(oa) * c * 0.42;
    var sheen = wheelCtx.createRadialGradient(ox, oy, 0, ox, oy, c * 0.9);
    var pulse = 0.05 + 0.03 * Math.sin(t * 1.4);
    sheen.addColorStop(0, 'rgba(255,255,255,' + pulse + ')');
    sheen.addColorStop(1, 'rgba(255,255,255,0)');
    wheelCtx.save();
    wheelCtx.beginPath();
    wheelCtx.arc(c, c, c - 1, 0, 2 * Math.PI);
    wheelCtx.clip();
    wheelCtx.fillStyle = sheen;
    wheelCtx.fillRect(0, 0, s, s);
    wheelCtx.restore();

    ['R', 'L'].forEach(function(k) {
      var p = handlePos(handles[k]);
      var rgb = hueToRgb(handles[k].hue, handles[k].sat, 254);
      var col = 'rgb(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ')';
      var rr = s * 0.045;
      // halo: the handle glows in its own color
      wheelCtx.save();
      wheelCtx.shadowColor = col;
      wheelCtx.shadowBlur = s * (dragging === k ? 0.09 : 0.05);
      wheelCtx.beginPath();
      wheelCtx.arc(p[0], p[1], rr, 0, 2 * Math.PI);
      wheelCtx.fillStyle = col;
      wheelCtx.fill();
      wheelCtx.restore();
      wheelCtx.lineWidth = Math.max(2, s * 0.008);
      wheelCtx.strokeStyle = dragging === k ? '#fff' : 'rgba(255,255,255,.8)';
      wheelCtx.beginPath();
      wheelCtx.arc(p[0], p[1], rr, 0, 2 * Math.PI);
      wheelCtx.stroke();
      wheelCtx.fillStyle = 'rgba(12,12,12,.85)';
      wheelCtx.font = '700 ' + Math.round(rr) + 'px "DM Sans",sans-serif';
      wheelCtx.textAlign = 'center';
      wheelCtx.textBaseline = 'middle';
      wheelCtx.fillText(k, p[0], p[1] + rr * 0.06);
    });
  }

  function wheelLampStates() {
    var bri = parseInt(wheelBri.value, 10);
    return [
      { rgb: hueToRgb(handles.R.hue, handles.R.sat, 254), bri: bri / 254 },
      { rgb: hueToRgb(handles.L.hue, handles.L.sat, 254), bri: bri / 254 }
    ];
  }

  var lastCast = 0, castQueued = false;
  var wheelEngaged = false;
  function wheelBlocked() {
    // a running show keeps the room unless the user explicitly takes it
    return running && running !== 'wheel' && !wheelEngaged;
  }
  function updateTakeBtn() {
    var b = document.getElementById('wheelTake');
    b.style.display = (live && running && running !== 'wheel') ? '' : 'none';
  }
  function castWheel(force) {
    if (!live) return;
    if (wheelBlocked()) {
      var b = document.getElementById('wheelTake');
      b.classList.add('armed');
      setTimeout(function() { b.classList.remove('armed'); }, 900);
      document.getElementById('wheelHint').textContent =
        'A preset has the room — the wheel previews only. Tap "Take the room" to override.';
      return;
    }
    var now = Date.now();
    if (!force && now - lastCast < 250) {
      if (!castQueued) {
        castQueued = true;
        setTimeout(function() { castQueued = false; castWheel(true); }, 260 - (now - lastCast));
      }
      return;
    }
    lastCast = now;
    var bri = parseInt(wheelBri.value, 10);
    fetch(DAEMON + '/set', {
      method: 'POST',
      body: JSON.stringify({ lights: {
        '11': { on: true, bri: bri, hue: Math.round(handles.R.hue), sat: Math.round(handles.R.sat), transitiontime: 2 },
        '12': { on: true, bri: bri, hue: Math.round(handles.L.hue), sat: Math.round(handles.L.sat), transitiontime: 2 }
      } })
    }).then(function() { running = null; markPlaying(); }).catch(function() {});
  }

  function wheelPoint(e) {
    var r = wheelCanvas.getBoundingClientRect();
    var scale = wheelSize / r.width;
    return [(e.clientX - r.left) * scale, (e.clientY - r.top) * scale];
  }

  wheelCanvas.addEventListener('pointerdown', function(e) {
    sizeWheel();
    var p = wheelPoint(e);
    var best = null, bestD = 1e9;
    ['R', 'L'].forEach(function(k) {
      var hp = handlePos(handles[k]);
      var d = Math.hypot(p[0] - hp[0], p[1] - hp[1]);
      if (d < bestD) { bestD = d; best = k; }
    });
    dragging = best;
    wheelCanvas.setPointerCapture(e.pointerId);
    moveHandle(p);
  });
  wheelCanvas.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    if (!(e.buttons & 1)) { dragging = null; return; }
    moveHandle(wheelPoint(e));
  });
  wheelCanvas.addEventListener('pointerup', function() {
    if (dragging) castWheel(true);
    dragging = null;
  });
  wheelCanvas.addEventListener('pointercancel', function() { dragging = null; });

  function moveHandle(p) {
    var c = wheelSize / 2;
    var dx = p[0] - c, dy = p[1] - c;
    var ang = Math.atan2(dy, dx);
    handles[dragging].hue = ((ang / (2 * Math.PI)) + 0.5) * 65535;
    handles[dragging].sat = Math.min(1, Math.hypot(dx, dy) / c) * 254;
    castWheel(false);
  }

  wheelBri.addEventListener('input', function() { castWheel(false); });
  document.getElementById('wheelTake').addEventListener('click', function() {
    wheelEngaged = true;
    castWheel(true);
    updateTakeBtn();
  });
  window.addEventListener('resize', sizeWheel);
  sizeWheel();

  // ── DESK (Live mixing console) ──
  var DESK_CHANNELS = [
    { id: 'kick',  label: 'Kick',  trigger: true },
    { id: 'hats',  label: 'Hats',  trigger: true },
    { id: 'bass',  label: 'Bass',  trigger: false },
    { id: 'synth', label: 'Synth', trigger: false },
    { id: 'vocal', label: 'Vocal', trigger: false }
  ];
  var deskControls = {};       // ctlId -> {get,set,min,max,el}

  function fmtS(v) { return v >= 1 ? v.toFixed(2) + 's' : Math.round(v * 1000) + 'ms'; }
  function fmtP(v) { return Math.round(v * 100) + '%'; }

  var _miniDisc = null;
  function miniDisc() {
    if (_miniDisc) return _miniDisc;
    var s = 108;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var x2 = c.getContext('2d');
    var img = x2.createImageData(s, s);
    var mid = s / 2;
    for (var y = 0; y < s; y++) {
      for (var x = 0; x < s; x++) {
        var dx = x - mid, dy = y - mid;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var idx = (y * s + x) * 4;
        if (dist > mid) { img.data[idx + 3] = 0; continue; }
        var hue = ((Math.atan2(dy, dx) / (2 * Math.PI)) + 0.5) * 65535;
        var rgb = hueToRgb(hue, Math.min(1, dist / mid) * 254, 254);
        img.data[idx] = rgb[0]; img.data[idx + 1] = rgb[1]; img.data[idx + 2] = rgb[2];
        img.data[idx + 3] = dist > mid - 2 ? Math.max(0, 255 * (mid - dist) / 2) : 255;
      }
    }
    x2.putImageData(img, 0, 0);
    _miniDisc = c;
    return c;
  }
  function deskSetLive() {}



  // ── THE ROOM: per-light live rack ──────────────────────────────────────
  // Four fixtures, each showing its REAL current color (polled), each with
  // its own wheel, brightness, and power. While a show runs the rack locks
  // (shows own the room) until "Take the room".
  var ROOM_FIXTURES = [
    { zone: 'left',       label: 'Left Bar',  kind: 'bar'  },
    { zone: 'wall_left',  label: 'Wall L',    kind: 'wash' },
    { zone: 'wall_right', label: 'Wall R',    kind: 'wash' },
    { zone: 'right',      label: 'Right Bar', kind: 'bar'  }
  ];
  var roomState = {};          // zone -> {id,on,bri,hue,sat,...}
  var roomEls = {};            // zone -> {glyph,card,bri,power,setDot}
  var lastRoomTouch = 0;
  var roomLocked = false;
  var roomSendTimers = {};

  function ctRgb(ct) {
    if (ct == null) return [255, 228, 192];
    if (ct > 320) return [255, 200, 140];
    if (ct > 230) return [255, 235, 210];
    return [222, 236, 255];
  }

  function fixtureColor(st) {
    if (!st || !st.on) return 'rgba(255,255,255,.07)';
    var rgb = st.colormode === 'ct' ? ctRgb(st.ct)
            : hueToRgb(st.hue, st.sat, 254);
    var k = 0.35 + 0.65 * (st.bri / 254);
    return 'rgb(' + (rgb[0] * k | 0) + ',' + (rgb[1] * k | 0) + ',' + (rgb[2] * k | 0) + ')';
  }

  function fixtureGlow(st) {
    if (!st || !st.on) return 'none';
    var rgb = st.colormode === 'ct' ? ctRgb(st.ct)
            : hueToRgb(st.hue, st.sat, 254);
    var a = 0.15 + 0.5 * (st.bri / 254);
    return '0 0 22px rgba(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ',' + a + '), 0 0 60px rgba(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ',' + (a * 0.4) + ')';
  }

  function roomSet(zone, patch) {
    var st = roomState[zone] || {};
    Object.assign(st, patch);
    roomState[zone] = st;
    lastRoomTouch = Date.now();
    paintFixture(zone);
    clearTimeout(roomSendTimers[zone]);
    roomSendTimers[zone] = setTimeout(function() {
      var body = {};
      var out = { transitiontime: 2 };
      ['on', 'bri', 'hue', 'sat'].forEach(function(k) {
        if (patch[k] !== undefined) out[k] = patch[k];
      });
      if (patch.on === undefined) out.on = true;
      body[st.id] = out;
      fetch(DAEMON + '/set', { method: 'POST',
        body: JSON.stringify({ lights: body }) })
        .then(function() { running = 'wheel'; markPlaying(); roomLock(); })
        .catch(function() {});
    }, 140);
  }

  function paintFixture(zone) {
    var els = roomEls[zone];
    var st = roomState[zone];
    if (!els || !st) return;
    els.glyph.style.background = fixtureColor(st);
    els.glyph.style.boxShadow = fixtureGlow(st);
    els.bri.value = st.bri || 0;
    els.power.textContent = st.on ? 'On' : 'Off';
    els.power.classList.toggle('on', !!st.on);
    els.card.classList.toggle('unreachable', st.reachable === false);
    if (els.setDot && st.colormode !== 'ct') {
      els.setDot(st.hue / 65535, st.sat / 254);
    }
  }

  function makeRoomWheel(zone) {
    var wrap = document.createElement('div');
    wrap.className = 'mini-wheel';
    var cv = document.createElement('canvas');
    cv.width = cv.height = 108;
    wrap.appendChild(cv);
    cv.getContext('2d').drawImage(miniDisc(), 0, 0);
    var dot = document.createElement('div');
    dot.className = 'mw-dot';
    wrap.appendChild(dot);
    var hue = 0.1, sat = 0.5;
    function render() {
      var ang = (hue - 0.5) * 2 * Math.PI;
      var r = sat * 50;
      dot.style.left = (50 + Math.cos(ang) * r) + '%';
      dot.style.top = (50 + Math.sin(ang) * r) + '%';
      var rgb = hueToRgb(hue * 65535, sat * 254, 254);
      dot.style.background = 'rgb(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ')';
    }
    function fromEvent(e) {
      var rect = wrap.getBoundingClientRect();
      var dx = e.clientX - rect.left - rect.width / 2;
      var dy = e.clientY - rect.top - rect.height / 2;
      hue = ((Math.atan2(dy, dx) / (2 * Math.PI)) + 0.5) % 1;
      sat = Math.min(1, Math.hypot(dx, dy) / (rect.width / 2));
      render();
      roomSet(zone, { hue: Math.round(hue * 65535),
                      sat: Math.round(sat * 254), on: true,
                      colormode: 'hs' });
    }
    var down = false;
    wrap.addEventListener('pointerdown', function(e) {
      down = true;
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
      fromEvent(e);
    });
    wrap.addEventListener('pointermove', function(e) {
      if (!down) return;
      if (!(e.buttons & 1)) { down = false; return; }
      fromEvent(e);
    });
    wrap.addEventListener('pointerup', function() { down = false; });
    wrap.addEventListener('pointercancel', function() { down = false; });
    render();
    return { el: wrap, setDot: function(h, s) { hue = h; sat = s; render(); } };
  }

  function buildRoom() {
    var rack = document.getElementById('roomRack');
    ROOM_FIXTURES.forEach(function(f) {
      var card = document.createElement('div');
      card.className = 'fixture';
      var stage = document.createElement('div');
      stage.className = 'fixture-stage';
      var glyph = document.createElement('div');
      glyph.className = 'fixture-glyph ' + f.kind;
      stage.appendChild(glyph);
      var name = document.createElement('div');
      name.className = 'fixture-name';
      name.textContent = f.label;
      var wheel = makeRoomWheel(f.zone);
      var bri = document.createElement('input');
      bri.type = 'range'; bri.min = 1; bri.max = 254; bri.value = 150;
      bri.className = 'fixture-bri';
      bri.addEventListener('input', function() {
        roomSet(f.zone, { bri: parseInt(bri.value, 10), on: true });
      });
      var power = document.createElement('button');
      power.className = 'fixture-power';
      power.textContent = 'Off';
      power.addEventListener('click', function() {
        var st = roomState[f.zone] || {};
        roomSet(f.zone, { on: !st.on });
      });
      card.appendChild(stage);
      card.appendChild(name);
      card.appendChild(wheel.el);
      card.appendChild(bri);
      card.appendChild(power);
      rack.appendChild(card);
      roomEls[f.zone] = { card: card, glyph: glyph, bri: bri,
                          power: power, setDot: wheel.setDot };
    });
  }

  function roomLock() {
    roomLocked = !!(running && running !== 'wheel');
    document.getElementById('roomRack').classList.toggle('locked', roomLocked && live);
    document.getElementById('roomTake').style.display =
      (roomLocked && live) ? '' : 'none';
  }

  document.getElementById('roomTake').addEventListener('click', function() {
    fetch(DAEMON + '/stop', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function() { running = null; markPlaying(); roomLock(); })
      .catch(function() {});
  });

  function roomPoll() {
    if (!live) return;
    fetch(DAEMON + '/lights/state').then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d.lights) return;
        running = d.status && d.status.running;
        roomLock();
        if (Date.now() - lastRoomTouch < 3000) return;
        Object.keys(d.lights).forEach(function(zone) {
          roomState[zone] = d.lights[zone];
          paintFixture(zone);
        });
      }).catch(function() {});
  }

  buildRoom();
  setInterval(roomPoll, 2500);

  // ── DAEMON LINK ──
  var linkline = document.getElementById('linkline');
  var linktext = document.getElementById('linktext');
  var nowbar = document.getElementById('nowbar');
  var nowtitle = document.getElementById('nowtitle');

  function markPlaying() {
    document.querySelectorAll('.preset').forEach(function(el) {
      el.classList.toggle('playing', live && el.getAttribute('data-id') === running);
    });
    var p = PRESETS.filter(function(x) { return x.id === running; })[0];
    if (live && p && p.type !== 'scene') {
      nowtitle.textContent = p.num + ' — ' + p.title;
      nowbar.classList.add('show');
    } else {
      nowbar.classList.remove('show');
    }
    if (typeof updateTakeBtn === 'function') updateTakeBtn();
    if (typeof roomLock === 'function') roomLock();
  }

  function setLive(on) {
    live = on;
    document.body.classList.toggle('live', on);
    linkline.classList.toggle('live', on);
    linktext.textContent = on
      ? 'Studio link live — tiles cast to the room'
      : 'Studio link offline — simulations only';
    var hint = document.getElementById('wheelHint');
    if (hint) hint.textContent = on
      ? 'Drag R and L to paint each lamp — the room follows live.'
      : 'Drag R and L to paint each lamp in the preview.';
    deskSetLive(on);
  }

  function syncStatus() {
    fetch(DAEMON + '/presets', { method: 'GET' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.presets && data.presets.length) {
          // daemon registry wins: newer presets appear without editing this file
          PRESETS = data.presets.map(function(p) {
            var pub = { id: p.id, num: p.num, title: p.title, tagline: p.tagline,
                        mood: p.mood, type: p.type, loop: p.loop || false,
                        duration: p.duration || null, sim: p.sim,
                        section: p.section || 'shows' };
            return pub;
          });
        }
        running = data.status && data.status.running;
        if (!live) { setLive(true); apply(); } else { markPlaying(); }
      })
      .catch(function() {
        if (live !== false) { setLive(false); running = null; markPlaying(); }
        setLive(false);
      });
  }

  function cast(p) {
    if (!live) return;
    wheelEngaged = false;          // starting a preset hands the room back
    fetch(DAEMON + '/start/' + encodeURIComponent(p.id), { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        running = data.status && data.status.running;
        markPlaying();
      })
      .catch(function() { setLive(false); });
  }

  document.getElementById('stopbtn').addEventListener('click', function() {
    fetch(DAEMON + '/stop', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function() { running = null; markPlaying(); })
      .catch(function() { setLive(false); });
  });

  // first paint with the public snapshot, then try the daemon
  setLive(false);
  apply();
  syncStatus();
  setInterval(syncStatus, 5000);

})();
</script>
