<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archive — Jackson Alexander Studio</title>
<meta name="description" content="Archive — vintage postcards, ephemera, and collected works by Jackson Alexander Studio in Santa Fe, NM.">
<link rel="canonical" href="https://jacksonalexanderstudio.com/archive.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Archive — Jackson Alexander Studio">
<meta property="og:description" content="Vintage postcards, ephemera, and collected works.">
<meta property="og:url" content="https://jacksonalexanderstudio.com/archive.html">
<meta property="og:site_name" content="Jackson Alexander Studio">
<meta name="author" content="Jackson Alexander">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Fragment+Mono&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFFFFF;--alt:#FFFFFF;--tx:#1A1919;--sec:#000;--br:#EBEBEB;--fn:'Fragment Mono','Courier New',monospace;--sf:'DM Sans',sans-serif;--accent:#D95740}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);line-height:1.6;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:1000;height:140px;background:#0c0c0c;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;transition:height .4s,box-shadow .4s}
#hdr.sc{box-shadow:0 1px 32px rgba(0,0,0,.06);height:88px}
.hi{width:100%;padding:0 28px;display:flex;align-items:center;justify-content:space-between}
.hl img{height:102px;width:auto;transition:height .4s;filter:invert(1)}
#hdr.sc .hl img{height:61px}
.hn{display:flex;align-items:center;gap:36px}
.hn a,.nb{font:400 11px/1 var(--fn);letter-spacing:.13em;text-transform:uppercase;color:#fff;background:none;border:none;padding:0;position:relative}
.hn a::after,.nb::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:#fff;transition:width .3s ease}
.hn a:hover::after,.nb:hover::after{width:100%}
.nw{position:relative}
.nb{display:flex;align-items:center;gap:5px}
.nw::before{content:'';position:absolute;top:100%;left:-20px;right:-20px;height:28px;z-index:99}
.nd{position:absolute;top:calc(100% + 28px);right:0;background:#0c0c0c;border:1px solid rgba(255,255,255,.1);min-width:260px;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .2s,transform .2s;z-index:100}
.nw:hover .nd,.nw:focus-within .nd,.nd.nd-open{opacity:1;pointer-events:all;transform:translateY(0)}
.nd a{display:flex;align-items:center;padding:12px 18px;font-size:11px;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
.nd a:last-child{border-bottom:none}
.nd a:hover{background:rgba(255,255,255,.06)}
.nd a::after{display:none}
.dn{color:#D95740;margin-right:10px;font-size:10px;font-family:var(--sf)}

/* ── PAGE HERO ── */
.page-hero{background:#0c0c0c;padding:200px 52px 80px;border-bottom:1px solid rgba(255,255,255,.1)}
.page-hero-inner{max-width:900px}
.page-hero h1{font-size:clamp(24px,3vw,39px);font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;letter-spacing:.04em;text-transform:none;color:#fff;margin-bottom:24px}
.page-hero p{font:300 13px/1.8 var(--sf);color:rgba(255,255,255,.55);max-width:520px;letter-spacing:.02em}

/* ── ARCHIVE LAYOUT ── */
.archive-layout{display:flex;position:relative}
#arc-sidebar{position:sticky;top:80px;width:322px;flex-shrink:0;align-self:flex-start;max-height:calc(100vh - 100px);overflow-y:auto;padding:52px 36px;z-index:1;scrollbar-width:thin;scrollbar-color:var(--br) transparent}
#arc-sidebar::-webkit-scrollbar{width:4px}
#arc-sidebar::-webkit-scrollbar-track{background:transparent}
#arc-sidebar::-webkit-scrollbar-thumb{background:var(--br);border-radius:2px}
.arc-label{font:700 13px/1.2 var(--sf);letter-spacing:.14em;text-transform:uppercase;color:var(--tx);padding-bottom:16px;border-bottom:1px solid var(--accent);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.arc-section{margin-bottom:24px}
.arc-section-header{font:400 11px/1 var(--fn);letter-spacing:.13em;text-transform:uppercase;color:var(--tx);display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--br);cursor:pointer}
.arc-section-toggle{font-family:var(--sf);font-size:16px;font-weight:300;color:var(--accent)}
.arc-filter-list{display:flex;flex-direction:column;padding-left:0;margin-top:8px;margin-bottom:8px}
.arc-filter-list.collapsed{display:none}
.arc-filter-link{font:400 8px/1 var(--sf);letter-spacing:.1em;text-transform:uppercase;color:#000;padding:5px 0;text-decoration:none;transition:color .2s;cursor:pointer}
.arc-filter-link:hover,.arc-filter-link.active{color:var(--accent)}
.arc-count{font:300 9px/1 var(--sf);color:rgba(0,0,0,.35);margin-left:6px}

/* ── GRID ── */
.archive-main{padding:52px 52px 100px}
.archive-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:48px;align-items:start}
.arc-item{position:relative;overflow:hidden;background:transparent;cursor:pointer;transition:transform .4s ease}
.arc-item:hover{transform:translateY(-4px)}
.arc-item img{width:100%;height:auto;display:block;transition:transform .6s ease}
.arc-item:hover img{transform:scale(1.06)}
.arc-ov{position:absolute;inset:0;background:none;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;opacity:1;transition:opacity .35s}
.arc-ov-num{font-size:18px;color:#fff;letter-spacing:.06em;line-height:1;margin-bottom:6px;font-family:var(--sf)}
.arc-ov-title{font-size:9px;color:rgba(255,255,255,.85);letter-spacing:.16em;text-transform:uppercase}
.arc-ov-date{font-size:8px;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-top:3px}

/* ── EMPTY STATE ── */
.arc-empty{grid-column:1/-1;text-align:center;padding:120px 20px;font:300 14px/1.8 var(--sf);color:rgba(0,0,0,.35);letter-spacing:.04em}

/* ── LIGHTBOX ── */
#lb{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column}
#lb.open{display:flex}
.lbi{position:relative;max-width:90vw;max-height:80vh;display:flex;align-items:center;justify-content:center}
.lbc{position:fixed;top:24px;right:28px;background:none;border:none;font-size:28px;color:var(--tx);cursor:pointer;z-index:10001;font-family:var(--sf)}
.lnv{position:fixed;top:50%;transform:translateY(-50%);background:var(--tx);color:#fff;border:none;width:40px;height:40px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lprev{left:16px}
#lnext{right:16px}
#limg{max-width:90vw;max-height:80vh;object-fit:contain}
.lm{text-align:center;margin-top:16px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx)}
.lt{margin-bottom:4px;font-family:var(--fn)}
.lct{font-family:var(--sf);font-size:9px;color:rgba(0,0,0,.45)}

/* ── FOOTER ── */
#ftr{background:#0c0c0c;padding:48px 28px;border-top:1px solid rgba(255,255,255,.1)}
.fi2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;font:400 10px/1.6 var(--fn);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.fc{text-align:center}
.fr{display:flex;gap:24px;justify-content:flex-end}
.fr a{color:rgba(255,255,255,.45);transition:color .2s}
.fr a:hover{color:#fff}

/* ── RESPONSIVE ── */
@media(max-width:1300px){
  .archive-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  .page-hero{padding:160px 20px 60px}
  .page-hero h1{font-size:clamp(14px,3.5vw,22px);letter-spacing:.14em;margin-bottom:16px}
  .page-hero p{font-size:12px;line-height:1.7}
  .archive-layout{flex-direction:column}
  #arc-sidebar{position:static;width:100%;max-height:none;border-bottom:1px solid var(--br);padding:20px;display:flex;flex-direction:column;gap:0}
  .archive-main{padding:24px 16px 80px}
  .archive-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .hi,.fi2{padding-left:16px;padding-right:16px}
  #hdr{height:88px}
  .hl img{height:52px}
  #hdr.sc .hl img{height:42px}
  .hn{gap:18px}
  .hn a,.nb{font-size:9px}
}
@media(max-width:600px){
  .archive-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .fi2{grid-template-columns:1fr;gap:12px;text-align:center}
  .fr{justify-content:center}
}
</style>
</head>
<body>


<!-- LIGHTBOX -->
<div id="lb"><div class="lbi">
  <button class="lbc" id="lbc">&#10005;</button>
  <button class="lnv" id="lprev">&#8592;</button>
  <img id="limg" src="" alt="">
  <button class="lnv" id="lnext">&#8594;</button>
  <div class="lm"><div class="lt" id="lt"></div><div class="lct" id="lct"></div></div>
</div></div>

<header id="hdr">
  <div class="hi">
    <a href="portfolio.html" class="hl"><img src="logos &amp; backgrounds/jack-logo-web.png" alt="Jackson Alexander Studio"></a>
    <nav class="hn">
      <div class="nw">
        <a href="portfolio.html" class="nb">Portfolio &#9662;</a>
        <div class="nd">
          <a href="portfolio.html#logos"><span class="dn">01</span>Logos</a>
          <a href="portfolio.html#illustration"><span class="dn">02</span>Illustration / Graphic</a>
          <a href="portfolio.html#craft"><span class="dn">03</span>Fabrication</a>
          <a href="portfolio.html#styling"><span class="dn">04</span>Creative Direction</a>
          <a href="portfolio.html#garden"><span class="dn">05</span>Jack&#39;s Garden</a>
          <a href="portfolio.html#production"><span class="dn">06</span>Production</a>
        </div>
      </div>
      <a href="case-studies.html">Case Studies</a>
      <a href="archive.html">Archive</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<!-- PAGE HERO -->
<div class="page-hero">
  <div class="page-hero-inner">
    <h1>Archive</h1>
    <p>An ever growing collection of objects that inspire me.</p>
  </div>
</div>

<!-- ARCHIVE GRID -->
<div class="archive-main">
  <div class="archive-grid" id="archive-grid"></div>
</div>

<footer id="ftr">
  <div class="fi2">
    <span>&#169; 2026 Jackson Alexander Studio</span>
    <span class="fc">Santa Fe, NM</span>
    <div class="fr">
      <a href="https://www.instagram.com/sandboxkid" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:jacksonalexanderstudio@gmail.com">jacksonalexanderstudio@gmail.com</a>
    </div>
  </div>
</footer>

<script>
(function() {
  'use strict';

  // ── HEADER SHRINK ──
  var hdr = document.getElementById('hdr');
  window.addEventListener('scroll', function() {
    hdr.classList.toggle('sc', window.scrollY > 60);
  });

  // ── NAV DROPDOWN (mobile) ──
  var nbBtn = document.querySelector('.nb');
  var ndMenu = document.querySelector('.nd');
  if (nbBtn && ndMenu) {
    nbBtn.addEventListener('click', function(e) {
      if (window.innerWidth <= 900) {
        e.preventDefault();
        ndMenu.classList.toggle('nd-open');
      }
    });
  }

  // ── LOAD POSTCARDS ──
  var grid = document.getElementById('archive-grid');
  var totalImages = 365;
  var allItems = [];

  for (var i = 1; i <= totalImages; i++) {
    allItems.push({ id: String(i).padStart(3, '0'), image: 'postcards/' + String(i).padStart(3, '0') + '.jpg' });
  }
  renderGrid(allItems);

  function renderGrid(data) {
    grid.innerHTML = '';
    data.forEach(function(item, idx) {
      var div = document.createElement('div');
      div.className = 'arc-item';
      div.innerHTML =
        '<img src="' + item.image + '" alt="Postcard ' + item.id + '" loading="lazy">' +
        '<div class="arc-ov">' +
          '<div class="arc-ov-num">' + item.id + '</div>' +
        '</div>';
      div.addEventListener('click', function() { openLightbox(data, idx); });
      grid.appendChild(div);
    });
  }

  // ── LIGHTBOX ──
  var lb = document.getElementById('lb');
  var limg = document.getElementById('limg');
  var lt = document.getElementById('lt');
  var lct = document.getElementById('lct');
  var lbItems = [];
  var lbIdx = 0;

  function openLightbox(items, idx) {
    lbItems = items;
    lbIdx = idx;
    showLightboxItem();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLightboxItem() {
    var item = lbItems[lbIdx];
    limg.src = item.image;
    limg.alt = item.title;
    lt.textContent = String(lbIdx + 1).padStart(3, '0');
    lct.textContent = item.title + (item.date ? ' — ' + item.date : '');
    document.getElementById('lprev').style.display = lbItems.length > 1 ? '' : 'none';
    document.getElementById('lnext').style.display = lbItems.length > 1 ? '' : 'none';
  }

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    limg.src = '';
  }

  document.getElementById('lbc').addEventListener('click', closeLightbox);
  document.getElementById('lprev').addEventListener('click', function() {
    lbIdx = (lbIdx - 1 + lbItems.length) % lbItems.length;
    showLightboxItem();
  });
  document.getElementById('lnext').addEventListener('click', function() {
    lbIdx = (lbIdx + 1) % lbItems.length;
    showLightboxItem();
  });

  document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { lbIdx = (lbIdx - 1 + lbItems.length) % lbItems.length; showLightboxItem(); }
    if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % lbItems.length; showLightboxItem(); }
  });

  lb.addEventListener('click', function(e) {
    if (e.target === lb || e.target.classList.contains('lbi')) closeLightbox();
  });

})();
</script>
</body>
</html>
