<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --disp:'Instrument Serif',Georgia,serif;
    --body:'Newsreader',Georgia,serif;
    --util:'Instrument Sans',Helvetica,Arial,sans-serif;
  }
  /* Semantic grounds: white = reading · black = records · grey = maps (09-19, was orange) */
  .band{--g:#FBFBFA;--ink:#121212;--dim:#74736F;--acc:#121212;--linec:#E3E2DF}
  *{box-sizing:border-box;margin:0;padding:0}
  /* overflow-anchor off: Chrome's scroll anchoring fights ScrollTrigger's
     unpin (fixed->flow swap) and yanks the page backwards right as a card
     completes; nothing on this page shifts layout, so anchoring buys nothing */
  /* scroll-behavior stays AUTO (2026-09-13): under CSS smooth, ScrollTrigger
     .refresh()'s internal scroll-to-0 animates and every pin start comes out
     offset by -scrollY whenever a refresh runs while scrolled (mid-page
     reload restore, resize, the late re-measure) - cards then fire thousands
     of px early. In-page anchors smooth-scroll via JS instead (see nav). */
  html{scroll-behavior:auto;overflow-anchor:none}
  body{background:#FBFBFA;color:#121212;font-family:var(--body);line-height:1.5;overflow-x:clip}

  /* sticky era nav */
  nav{position:sticky;top:0;z-index:10;display:flex;gap:2px;justify-content:center;
    padding:12px 16px;font-family:var(--util);font-size:12.5px;
    background:color-mix(in srgb, var(--g) 88%, transparent);backdrop-filter:blur(10px);color:var(--ink)}
  nav{--g:#FBFBFA;--ink:#121212;--dim:#74736F;--acc:#121212}
  nav a{color:var(--dim);text-decoration:none;padding:4px 12px}
  nav a.on{color:var(--acc)}
  nav .mast{margin-right:auto;color:var(--ink);font-family:var(--disp);font-style:italic;font-size:15px}
  nav .spacer{margin-left:auto}

  .band{--pad:clamp(24px,6vw,90px);position:relative;background:var(--g);color:var(--ink);padding:clamp(48px,8vw,110px) var(--pad) 0}
  .vwrap{position:absolute;top:0;bottom:0;right:14px;display:flex;flex-direction:column;
    justify-content:flex-end;padding-bottom:64px;pointer-events:none;z-index:5}
  .vmark{position:sticky;bottom:36px;writing-mode:vertical-rl;font-family:var(--disp);
    font-size:clamp(30px,4.6vw,52px);line-height:1;letter-spacing:.015em;color:#101010;
    white-space:nowrap;opacity:0;transition:opacity .5s}
  .vmark .vm-b{position:absolute;inset:0;color:#FBFBFA}
  .vmark.on{opacity:1}
  .found{font-family:var(--body);font-style:italic;font-size:16px;color:var(--dim)}
  .numeral{font-family:var(--disp);font-style:italic;font-size:clamp(96px,16vw,190px);line-height:.95;margin-top:26px}
  .era-line{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;margin-top:8px}
  .era-title{font-family:var(--disp);font-size:clamp(30px,4.6vw,52px);line-height:1.05;letter-spacing:.015em}
  .era-sub{font-family:var(--body);font-style:italic;font-size:15.5px;line-height:24px;color:var(--dim)}

  /* site hero */
  /* basement light: three slow blurred beams staining the paper — the
     lumen wash architecture translated to a white ground (multiply, low
     opacity, 3am drift) */
  .hero-washes{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .hero-wash{position:absolute;width:130%;height:30%;filter:blur(48px);
    mix-blend-mode:multiply;opacity:.22}
  /* dub palette sunk to the floor: near-black ember, abyss petrol, void slate */
  .hw1{background:linear-gradient(90deg,transparent,#4a1f12 35%,#2b130c 60%,transparent);
    top:4%;left:-18%;transform:rotate(-14deg);animation:hwd1 23s ease-in-out infinite alternate}
  .hw2{background:linear-gradient(90deg,transparent,#0f2b29 40%,#0a1c22 65%,transparent);
    top:38%;left:-12%;transform:rotate(8deg);animation:hwd2 29s ease-in-out infinite alternate}
  .hw3{background:linear-gradient(90deg,transparent,#181c30 45%,#0e101d 70%,transparent);
    top:66%;left:-20%;transform:rotate(-22deg);animation:hwd3 34s ease-in-out infinite alternate}
  @keyframes hwd1{to{transform:rotate(-10deg) translateX(5%)}}
  @keyframes hwd2{to{transform:rotate(11deg) translateX(-4%)}}
  @keyframes hwd3{to{transform:rotate(-25deg) translateX(6%)}}
  .hero-text{position:relative;z-index:1}
  .hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center}
  .hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(52px,9vw,128px);line-height:1;margin-top:22px;font-style:italic;letter-spacing:.015em}
  .hero .thesis{font-size:clamp(17px,2vw,21px);color:var(--dim);max-width:44ch;margin-top:26px}
  .hero .thesis b{color:var(--ink);font-weight:500}
  .hero .credit{font-family:var(--body);font-style:italic;font-size:14.5px;line-height:24px;color:var(--dim);margin-top:16px}

  /* chapter */
  /* 4px baseline unit: every leading is a multiple; paragraph spacing in
     column text = one full line so side-by-side baselines register */
  .essay{max-width:64ch;font-size:18px;font-weight:300;line-height:28px}
  .essay p+p{margin-top:28px}
  .essay a.xref{color:inherit;text-decoration:underline;text-decoration-thickness:1px;
    text-underline-offset:3.5px;text-decoration-color:color-mix(in srgb,currentColor 30%,transparent);
    transition:text-decoration-color .25s}
  .essay a.xref:hover{text-decoration-color:var(--acc)}
  .essay.cols{max-width:min(69vw,1360px);column-count:2;column-gap:clamp(56px,7vw,104px)}
  .sidenote{font-family:var(--util);font-size:15px;line-height:24px;max-width:56ch;margin-top:8px}
  /* long notes (>700ch) split into two columns like the essays; paragraph
     gap = one full 24px line so the columns share the baseline (09-19) */
  .sidenote.cols{max-width:min(69vw,1360px);column-count:2;column-gap:clamp(56px,7vw,104px)}
  .sidenote.cols p+p{margin-top:24px}
  /* two-column text: a paragraph never splits across the gutter, so the
     second column starts with a whole paragraph at the top instead of the
     tail of one (Jackson 09-20: 'locked to the top of the first paragraph') */
  .essay.cols p,.sidenote.cols p{break-inside:avoid;page-break-inside:avoid}
  .sidenote p+p{margin-top:12px}
  @media (max-width:900px){.essay.cols,.sidenote.cols{column-count:1;max-width:64ch}}
  .essay.lede{margin-top:44px}
  .sec-title{font-family:var(--disp);font-size:clamp(24px,3.2vw,34px);font-weight:400;margin:72px 0 10px;max-width:30ch;text-wrap:balance;letter-spacing:.012em}
  .sec-title::before{content:"— ";color:#E8481C}
  .subnote{--g:#D6D4CF;--ink:#141414;background:var(--g);color:var(--ink);
    margin:0 calc(var(--pad) * -1);padding:clamp(40px,6vh,72px) var(--pad);
    min-height:clamp(200px,26vh,320px);display:flex;align-items:center;gap:20px}
  .subnote h3{font-family:var(--disp);font-size:clamp(24px,3.2vw,34px);font-weight:400;
    letter-spacing:.012em;max-width:34ch;text-wrap:balance;margin:0}
  /* 01.2 sub-chapter card + curtain retired 2026-09-19 (Jackson): its note now closes the chapter-01 essay */
  .era-title .tw{display:inline-block;margin-right:.3em}
  .era-title .tw:last-child{margin-right:0}
  .subnote+.ledger{margin-top:0}
  .divider{font-family:var(--disp);font-size:clamp(22px,3vw,30px);font-weight:400;color:var(--ink);margin:84px 0 0;border-top:1px solid var(--linec);padding-top:26px;max-width:30ch;text-wrap:balance;letter-spacing:.012em}
  .essay+.ledger{margin-top:clamp(88px,11vh,150px)}
  .sec-title+.ledger{margin-top:44px}
  .diagram+.ledger{margin-top:0}
  .ledger+.diagram{margin-top:0}
  .sec-title+.essay{margin-top:16px}
  /* blurb sits centered between a plate and its slab: same symmetry token
     above the title as the essay->ledger gap below */
  .diagram+.sec-title{margin-top:clamp(88px,11vh,150px)}

  .ledger{--g:#101010;--ink:#F2F1EE;--dim:#8B8B88;--acc:#F2F1EE;--linec:#2A2A2A;
    background:var(--g);color:var(--ink);
    margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1);
    padding:clamp(40px,6vh,72px) var(--pad)}
  .ledger + .ledger{margin-top:0;padding-top:0}
  .row{display:grid;grid-template-columns:26px 84px minmax(190px,270px) 1fr auto;gap:8px 18px;
    align-items:center;padding:12px 0;border-bottom:1px solid var(--linec);max-width:1180px;position:relative}
  .pvbar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--acc)}
  .sleeve{width:84px;height:84px;object-fit:cover;display:block;transition:border-radius .45s}
  .row.playing img.sleeve{border-radius:50%;animation:platter 4s linear infinite}
  span.sleeve{height:auto}
  .dot{color:var(--acc);font-size:11px}
  button.dot{background:none;border:0;padding:14px;margin:-14px;cursor:pointer;font-family:var(--util);
    font-size:11px;color:var(--acc);line-height:1;text-align:left}
  button.dot.mute{color:var(--ink);opacity:.4}
  /* the trail speaks in one color: plate orange marks every start-here row */
  .row.pri .dot{color:#E8481C}
  .who{display:flex;flex-direction:column;gap:2px}
  .artist{font-family:var(--util);font-size:14px;font-weight:500;line-height:20px}
  .release{font-family:var(--disp);font-size:18px;font-style:italic;color:var(--ink);line-height:24px}
  .note{font-family:var(--util);font-size:13.5px;color:var(--ink);line-height:20px;max-width:58ch}
  .bc{font-family:var(--body);font-style:italic;font-size:14px;color:var(--acc);text-decoration:none;white-space:nowrap;
    grid-column:-2;justify-self:end;background:none;border:0;cursor:pointer;padding:15px 12px;margin:-15px -12px}
  .bc:hover{text-decoration:underline;text-underline-offset:3px}
  .ls{grid-column:-2;justify-self:end;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
  .playwrap{grid-column:2/-1;margin:6px 0 4px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .playwrap iframe{width:100%;max-width:640px;height:120px;border:0;display:block;flex:1 1 320px}
  #npbar{position:fixed;right:96px;bottom:20px;z-index:80;display:flex;align-items:center;gap:12px;
    background:#FBFBFA;color:#101010;border:1px solid rgba(16,16,16,.22);padding:10px 16px;
    width:min(440px,calc(100vw - 132px));opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity .28s,transform .28s}
  #npbar.on{opacity:1;pointer-events:auto;transform:none}
  #npbar .np-gl{color:#E8481C;font-size:11px;flex:none;background:none;border:0;
    font-family:inherit;padding:10px;margin:-10px;cursor:default}
  #npbar.pv .np-gl{cursor:pointer}
  #npbar .np-mid{flex:1 1 auto;min-width:0}
  #npbar .np-sub{display:none;align-items:center;gap:10px}
  #npbar.pv .np-sub{display:flex}
  #npbar .np-tl{flex:1 1 auto;position:relative;height:14px;cursor:pointer}
  #npbar .np-time{font-family:var(--util);font-size:11px;line-height:20px;color:var(--dim);flex:none;
    font-variant-numeric:tabular-nums}
  /* volume speaks the same hairline language as the seek bar; ink fill so
     it never reads as progress */
  #npbar .np-vl{position:relative;width:56px;height:14px;flex:none;cursor:pointer;touch-action:none}
  #npbar .np-vl::before{content:'';position:absolute;left:0;right:0;top:6px;height:2px;
    background:rgba(16,16,16,.16)}
  #npbar .np-vf{position:absolute;left:0;top:6px;height:2px;width:80%;background:#101010}
  #npbar .np-nx{display:none;font-family:var(--util);font-size:11.5px;line-height:20px;color:var(--dim);
    margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #npbar.pv .np-nx.on{display:block}
  .playwrap button.alb{font-family:var(--util);font-size:12px;line-height:20px;color:var(--ink);
    background:none;border:1px solid var(--dim);padding:8px 16px;cursor:pointer;flex:none;
    white-space:nowrap;transition:background .15s,color .15s}
  .playwrap button.alb:hover{background:var(--ink);color:var(--g);border-color:var(--ink)}
  #npbar .np-tl::before{content:'';position:absolute;left:0;right:0;top:6px;height:2px;background:rgba(16,16,16,.16)}
  #npbar .np-tf{position:absolute;left:0;top:6px;height:2px;width:0;background:#E8481C}
  #npbar .np-fl{font-family:var(--body);font-style:italic;font-size:12.5px;line-height:20px;color:var(--dim);
    text-decoration:none;flex:none}
  #npbar .np-fl:hover{text-decoration:underline}
  #npbar .np-t{display:block;min-width:0;cursor:pointer;text-align:left;background:none;border:0;padding:0;color:inherit}
  #npbar .np-a{display:block;font-family:var(--util);font-size:13px;line-height:20px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #npbar .np-r{display:block;font-family:var(--disp);font-style:italic;font-size:15px;line-height:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #npbar .np-t:hover .np-r{text-decoration:underline;text-underline-offset:3px}
  #npbar .np-x{background:none;border:0;color:#101010;opacity:.55;cursor:pointer;font-size:11px;
    padding:10px;margin:-10px;flex:none}
  #npbar .np-x:hover{opacity:1}
  .playwrap a{font-family:var(--body);font-style:italic;font-size:12.5px;color:var(--dim);text-decoration:none;display:inline-block;margin-top:6px}
  .playwrap a:hover{text-decoration:underline}

  /* crate view (pilot, ?crate): horizontal record-bin for a chapter's list */
  .crate{--g:#101010;--ink:#F2F1EE;--dim:#8B8B88;--acc:#F2F1EE;--linec:#2A2A2A;
    position:relative;isolation:isolate;
    background:var(--g);color:var(--ink);margin:0 calc(var(--pad) * -1);
    padding:56px var(--pad) 56px;overflow:hidden;   /* equal breath top/bottom (Jackson 09-19: "hugging the margin") */
    display:flex;flex-direction:column;justify-content:flex-start}
  .crate-view{overflow:visible;min-width:0;perspective:1400px;perspective-origin:50% 38%}
  /* CHLADNI PLATE (Jackson 09-19): the hero's sand engine behind every crate,
     driven by the playing record's loudness and beats; far back, under
     everything, never in the way */
  .crate-sand{position:absolute;inset:0;z-index:0;color:#5C5C54;pointer-events:none;filter:blur(0.5px)}
  .crate-player > .crate-sand{z-index:0}
  /* the queue is translucent so the plate shows through it (Jackson 09-19) */
  .cs:not(.on){opacity:.5}
  .cs::after{opacity:.3}
  /* crate inherits the ledger's rhythm: full breath after editorial text,
     tighter after a blurb title, flush after grey/orange slabs */
  .essay+.crate,.sidenote+.crate{margin-top:clamp(88px,11vh,150px)}
  .sec-title+.crate{margin-top:44px}
  .subnote+.crate,.diagram+.crate{margin-top:0}
  .crate-rail{position:relative;height:var(--csw);transform-style:preserve-3d;cursor:grab;
    touch-action:pan-y;
    transition:transform .5s cubic-bezier(.22,.9,.24,1)}
  .crate-rail.drag{transition:none;cursor:grabbing}
  /* one plane, one gridline: identical squares hugging the slab top,
     ~3/4 of the box; the LEFTMOST cover is always the active one */
  /* the queue stacks like the old iTunes flow (Jackson 09-18): each record
     overlaps the previous by a quarter and sits behind it, scaled down a
     touch per step back in the queue (--s/--z set per figure on seat()) */
  .crate{--csw:clamp(380px,62vh,700px)}
  /* COVER FLOW (Jackson 09-18, after the iTunes reference): the active
     record flat and forward at center, both sides angled in perspective and
     stacked, mirrored on the black floor. seat() places each record by its
     distance d from the active (--x/--zt/--ry/--z); records beyond +-5 are
     not rendered (.far) and sleeping crates keep only the active one, so
     the angled covers never pile up GPU layers. */
  .cs{position:absolute;left:50%;top:0;width:var(--csw);margin:0;cursor:pointer;
    z-index:var(--z,1);backface-visibility:hidden;
    transform:translateX(calc(-50% + var(--x,0px))) translateZ(var(--zt,0px)) rotateY(var(--ry,0deg));
    transition:border-radius .5s,transform .55s cubic-bezier(.22,.9,.24,1)}
  /* floor reflection tried 09-18 and set aside (Jackson: keep it clean; may
     come back): -webkit-box-reflect:below 2px linear-gradient(rgba(0,0,0,.42),transparent 48%) */
  .cs.far{display:none}
  .crate.asleep .cs:not(.on){display:none}
  /* queued records dim under an OPAQUE veil (not opacity: overlapped covers
     would double-expose); the active one is clear */
  .cs::after{content:'';position:absolute;inset:0;background:#101010;opacity:.55;pointer-events:none;
    transition:opacity .5s}
  .cs.on::after{opacity:0}
  .cs img,.cs .cs-blank{width:100%;aspect-ratio:1;display:block;object-fit:cover}
  .cs .cs-blank{background:#1C1C1C}
  .cs.on{opacity:1}
  .cs.hov:not(.on)::after{opacity:.25}
  .cs.hov:not(.on){transform:translateX(calc(-50% + var(--x,0px))) translateZ(calc(var(--zt,0px) + 40px)) rotateY(var(--ry,0deg))}
  .cs.on.playing::after{border-radius:50%}
  .cs.on.playing img{border-radius:50%;animation:platter 4s linear infinite}
  /* the nav + info + player column hangs centered under the active record,
     the record's width wide (Jackson 09-18); text left-aligned within it */
  .crate-side{margin:0 auto;width:var(--csw);max-width:100%}
  /* TRACKLIST + PLAYER (Jackson 09-19): the chapter's records as a text
     list with their sleeves down the LEFT quarter; the right three quarters
     are THE PLAYER — the active record as a platter over the Chladni plate,
     an expanded info panel beside it, prev/next beneath. The list frame is
     the player's full height. One 18px leading unit. */
  .crate.list{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,3fr);column-gap:28px;align-items:stretch}
  .crate.list .crate-list-wrap{grid-column:1;grid-row:1;position:relative;min-height:var(--csw)}
  .crate-player{grid-column:2;grid-row:1;position:relative;min-height:var(--csw);overflow:clip}
  /* the record sits centered between the tracklist and the info (Jackson
     09-19): the player splits in two halves, the platter centered in the
     left one, the info filling the right one */
  .cp-inner{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:0;align-items:start}
  .cp-platter{grid-column:1;grid-row:1;margin:0 auto;width:min(84%,var(--csw));aspect-ratio:1;position:relative;left:-14px}   /* -half the list gap: equal air to the list and to the info */
  .crate.list .crate-side{padding-right:clamp(16px,2vw,40px)}
  .cp-disc{display:block;width:100%;height:100%;object-fit:cover;transition:border-radius .5s;box-shadow:0 0 0 1px rgba(242,241,238,.08)}
  .cp-platter.blank .cp-disc{display:none}
  .cp-platter.blank .cp-blank{display:block;width:100%;height:100%;background:#1C1C1C}
  .cp-blank{display:none}
  .cp-platter.playing .cp-disc{border-radius:50%;animation:platter 4s linear infinite}
  .crate.list .crate-side{grid-column:2;grid-row:1;min-width:0}
  /* the nav spans the album art pixel for pixel (Jackson 09-19): same grid track, same width formula, same -14px shift as .cp-platter */
  .crate.list .crate-nav{grid-column:1;grid-row:2;width:min(84%,var(--csw));margin:48px auto 0;position:relative;left:-14px;max-width:none}
  .crate.list .crate-panel.row{margin-top:0;padding:0}
  /* the preview timeline is its own element under the controls (Jackson
     09-20): 28px of air below the play button, a full-width track line, the
     progress fill riding on it - no longer glued to the button's edge */
  .crate.list .crate-panel.row:has(.pvbar){padding-bottom:28px;border-bottom:2px solid rgba(242,241,238,.18)}
  .crate.list .crate-panel .pvbar{max-width:none;bottom:-2px}
  .crate.list .crate-panel .release{font-size:clamp(28px,3vw,44px)}
  .crate.list .crate-panel .note{max-width:62ch;font-size:14.5px;line-height:22px;margin-top:16px}
  .crate.list .crate-panel .playwrap,.crate.list .crate-panel .playwrap iframe{max-width:560px}
  .crate-list{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:#2A2A2A transparent;padding:0 8px 64px 0;
    -webkit-mask-image:linear-gradient(#000 calc(100% - 40px),transparent);mask-image:linear-gradient(#000 calc(100% - 40px),transparent)}
  .tl-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:0 14px;align-items:center;
    padding:14px 0;border-bottom:1px solid var(--linec);cursor:pointer}
  .tl-row:first-child{padding-top:0}          /* first row's art sits ON the platter's top edge */
  .tl-art{width:48px;height:48px;object-fit:cover;display:block;transition:border-radius .45s}
  .tl-art.blank{background:#1C1C1C}
  .tl-row.playing .tl-art{border-radius:50%;animation:platter 4s linear infinite}
  .tl-text{min-width:0}
  .tl-artist{display:block;font-family:var(--util);font-size:13px;font-weight:500;line-height:18px;color:var(--dim)}
  .tl-release{display:block;font-family:var(--util);font-weight:600;font-size:14px;line-height:18px;color:var(--ink)}
  .tl-row.on .tl-artist{color:var(--ink)}
  .tl-play{font-family:var(--util);font-size:11px;line-height:18px;color:var(--ink);background:none;
    border:1px solid var(--linec);border-radius:50%;width:32px;height:32px;padding:0;margin-top:2px;

<script>
(function(){
  var map=document.querySelector(".map"), cols=[].slice.call(document.querySelectorAll(".rm-col[data-reveal]"));
  var still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  // the map spans every year of the chapter (1992-2020) but the records stop early; size the
  // columns at 44px and pan only as far as the last populated year, so the view never drifts
  // into the empty tail
  var COL=44, W=cols.length*COL, STEP=200, HOLD=2600, timers=[];
  // stop at the last populated year BEFORE a long gap (era 01: dense to 2011, then eight empty
  // years and a lone 2020 record - the tile is a teaser, it ends at 2011)
  var last=-1, gap=0, N=cols.length;
  for (var i=0;i<cols.length;i++){ if(cols[i].querySelector(".rm-rec")){ if(gap>=5 && last>=0){ N=last+1; break; } last=i; gap=0; } else gap++; }
  if(N===cols.length) N=last+1;
  var PAN=N*STEP+600;
  map.style.setProperty("--w", W+"px");
  function fit(){ var h=map.offsetHeight||1, s=Math.min(1, innerHeight/h); map.style.setProperty("--s", s); return Math.max(0, N*COL*s-innerWidth); }
  function cycle(){
    timers.forEach(clearTimeout); timers=[];
    map.classList.remove("pan"); map.style.setProperty("--x","0px"); cols.forEach(function(c){ c.classList.remove("in"); });
    void map.offsetWidth;
    var range=fit();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      map.style.setProperty("--pan", PAN+"ms"); map.classList.add("pan"); map.style.setProperty("--x", -range+"px");
      cols.forEach(function(c,i){ if(i<N) timers.push(setTimeout(function(){ c.classList.add("in"); }, 200+i*STEP)); });
      timers.push(setTimeout(cycle, PAN+HOLD));
    }); });
  }
  if(still){ cols.forEach(function(c){ c.classList.add("in"); }); fit(); addEventListener("resize", fit); return; }
  addEventListener("resize", function(){ var r=fit(); if(map.classList.contains("pan")) map.style.setProperty("--x", -r+"px"); });
  addEventListener("load", cycle);
})();
</script>
