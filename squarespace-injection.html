<!-- PART 1: PASTE INTO Settings > Advanced > Code Injection > Header -->
<!-- ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet" />

<script>
  // ── Scroll-aware nav ──
  document.addEventListener('DOMContentLoaded', function () {
    const header = document.querySelector('header');
    if (!header) return;

    function onScroll() {
      if (window.scrollY > 50) {
        header.classList.add('ja-scrolled');
      } else {
        header.classList.remove('ja-scrolled');
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  });
</script>
